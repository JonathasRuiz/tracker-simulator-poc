services:
  socket-proxy:
    image: docker.io/tecnativa/docker-socket-proxy
    container_name: socket-proxy
    user: root
    privileged: true
    volumes:
      - '${DOCKER_SOCK}:/var/run/docker.sock:rw'
    ports:
      - '2375:2375'
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - SWARM=1
      - TASKS=1
      - NETWORKS=1
      - NODES=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      - PING=1
      - POST=1
    networks:
      - horizontalscaling      
  consul:
    image: docker.io/hashicorp/consul:latest
    ports:
      - "8500:8500"
    command: agent -server -bootstrap -ui -client=0.0.0.0
    networks:
      - horizontalscaling
  registrator:
    image: docker.io/gliderlabs/registrator:master
    user: root
    privileged: true      
    volumes:
      - ${DOCKER_SOCK}:/tmp/docker.sock:rw
    command: "-resync 3 -internal consul://consul:8500"
    depends_on:
      - consul
    networks:
      - horizontalscaling
  haproxy:
    image: docker.io/haproxy:2.8-alpine
    container_name: haproxy
    user: root
    privileged: true
    ports:
      - "8000:8000"      # Traffic
      - "8001:8001"      # gRPC traffic
      - "8404:8404"  # Dashboard (See the magic happening)
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # Socket for dynamic commands (The Secret Sauce)
      - haproxy-socket:/var/run/haproxy
    networks:
      - horizontalscaling
  haproxy-sidecar:
      build:
        context: .
        dockerfile: Dockerfile.haproxy-sidecar
      container_name: haproxy-sidecar
      privileged: true
      user: root      
      depends_on:
        - haproxy
        - consul
      volumes:
        # Templates and Scripts
        - ./haproxy/hosts.ctmpl:/etc/consul-templates/hosts.ctmpl
        - ./haproxy/hosts-grpc.ctmpl:/etc/consul-templates/hosts-grpc.ctmpl
        - ./haproxy/update-haproxy.sh:/etc/consul-templates/update-haproxy.sh
        - ./haproxy/run-sidecar.sh:/etc/consul-templates/run-sidecar.sh:ro
        # Access to the socket
        - haproxy-socket:/var/run/haproxy
      # Sidecar wrapper: periodic re-sync loop + consul-template watches
      entrypoint: ["/bin/sh", "/etc/consul-templates/run-sidecar.sh"]
      networks:
        - horizontalscaling         
  redis:
    image: docker.io/redis
    ports:
      - '6379:6379'
    depends_on:
      - haproxy
      - consul
    networks:
      - horizontalscaling
  emqx:
    image: docker.io/emqx/emqx:5.8.3
    ports:
      - "1883:1883"
      - "9001:8083"
      - "8090:8083" # Ws port for WebSocket support
      - "14567:14567/udp" # QUIC
      - "18083:18083" # Dashboard
    environment:
      - EMQX_ALLOW_ANONYMOUS=true
      - EMQX_LISTENERS__QUIC__DEFAULT__ENABLED=true
      - EMQX_LISTENERS__QUIC__DEFAULT__KEYFILE=etc/certs/key.pem
      - EMQX_LISTENERS__QUIC__DEFAULT__CERTFILE=etc/certs/cert.pem
    networks:
      - horizontalscaling
  jaeger-all-in-one:
    container_name: docker.io/jaeger
    image: jaegertracing/all-in-one:latest
    ports:
      - "15000:16686" # Jaeger UI
      - "14268:14268" # Receive legacy OpenTracing traces, optional
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver, not yet used by Quarkus, optional
      - "14250:14250" # Receive from external otel-collector, optional
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - horizontalscaling      
  prometheus:
    image: docker.io/prom/prometheus:v2.26.0
    container_name: prometheus
    ports:
      - 9090:9090
    environment:
      - PROMETHEUS_HOST=${PROMETHEUS_HOST}
      - TRACKER_HOST=${TRACKER_HOST}
      - TRACKERCLIENT_HOST=${TRACKERCLIENT_HOST}
    volumes:
      - ./prometheus.infra.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml
    networks:
      - horizontalscaling
  grafana:
    image: docker.io/grafana/grafana-enterprise
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - 'grafana_storage:/var/lib/grafana'
    depends_on:
      - prometheus
    networks:
      - horizontalscaling      
volumes:
  haproxy-socket: {}
  grafana_storage: {}
networks:
  horizontalscaling:
    driver: bridge
